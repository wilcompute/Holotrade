name: Mass36 to mass40 inheritance separator

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass36_to_mass40_inheritance_separator.py'
      - 'analysis/mass36_depth4_structural_types.py'
      - 'analysis/mass40_no_pencil_30_orbit_index.json'
      - '.github/workflows/mass36_to_mass40_inheritance_separator.yml'
  workflow_dispatch:

jobs:
  separate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install ortools scipy sympy numpy
      - name: Certify inherited versus born mass40 depth4 classes
        env:
          W33_ANALYSIS: ${{ github.workspace }}/w33/analysis
        run: PYTHONPATH=analysis python analysis/mass36_to_mass40_inheritance_separator.py
      - uses: actions/upload-artifact@v4
        with:
          name: mass36-to-mass40-inheritance-separator
          path: analysis/mass36_to_mass40_inheritance_separator_certificate.json

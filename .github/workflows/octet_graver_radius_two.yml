name: Octet Graver radius-two theorem

on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_graver_radius_two_theorem.py'
      - 'analysis/octet_gauge_local_minimum_counterexample.py'
      - 'analysis/the_kernel_is_spanned_by_octet_differences.py'
      - '.github/workflows/octet_graver_radius_two.yml'
  workflow_dispatch:

jobs:
  graver-test-set:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ortools sympy
          sudo apt-get update
          sudo apt-get install -y 4ti2
      - name: Write exact incidence matrix
        run: PYTHONPATH=analysis python analysis/octet_graver_radius_two_theorem.py --write-matrix
      - name: Compute exact Graver basis with 4ti2
        id: graver
        run: |
          set -euo pipefail
          BIN="$(command -v 4ti2-graver || command -v graver || true)"
          if [ -z "$BIN" ]; then echo '4ti2 graver executable not found'; dpkg -L 4ti2; exit 1; fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          VERSION="$($BIN --version 2>&1 | head -n 1 || true)"
          if [ -z "$VERSION" ]; then VERSION="$(dpkg-query -W -f='${Version}' 4ti2)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd analysis
          "$BIN" octet_graver
          test -s octet_graver.gra
      - name: Verify global radius-two test-set criterion
        env:
          FOURTI2_VERSION: ${{ steps.graver.outputs.version }}
        run: PYTHONPATH=analysis python analysis/octet_graver_radius_two_theorem.py --gra analysis/octet_graver.gra --version "$FOURTI2_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: octet-graver-radius-two
          path: |
            analysis/octet_graver.mat
            analysis/octet_graver.gra
            analysis/octet_graver_radius_two_certificate.json

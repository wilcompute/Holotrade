name: Mass24 Steinberg Gram192 explicit W33 embedding

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass24_steinberg_gram192_explicit_w33_embedding.py'
      - 'analysis/mass24_steinberg_integral_gram_gauge_certificate.json'
      - '.github/workflows/mass24_steinberg_gram192_explicit_w33_embedding.yml'
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install numpy sympy scipy
      - name: Construct explicit cube-frame to Gram192 embedding
        env:
          W33_ANALYSIS: ${{ github.workspace }}/w33/analysis
        run: PYTHONPATH=analysis python analysis/mass24_steinberg_gram192_explicit_w33_embedding.py
      - uses: actions/upload-artifact@v4
        with:
          name: mass24-steinberg-gram192-explicit-w33-embedding
          path: analysis/mass24_steinberg_gram192_explicit_w33_embedding_certificate.json

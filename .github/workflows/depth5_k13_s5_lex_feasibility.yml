name: depth5 K13 S5 lex feasibility
on:
  push:
    branches: [master]
    paths:
      - 'analysis/depth5_k13_s5_lex_feasibility.py'
      - 'analysis/depth5_coordinate_s5_automorphism.py'
      - '.github/workflows/depth5_k13_s5_lex_feasibility.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holotrade-depth5-k13-s5-lex-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy ortools
      - name: Execute S5 lex-leader K13 attack
        shell: bash
        run: |
          set -o pipefail
          python analysis/depth5_k13_s5_lex_feasibility.py 2>&1 | tee analysis/DEPTH5_K13_S5_LEX_FEASIBILITY.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/depth5_k13_s5_lex_feasibility.json').read_text())
          assert d.get('valid') is True
          assert d['symmetry']['group']=='S5' and d['symmetry']['order']==120
          assert d['result'] in ('K13_INFEASIBLE','K13_FEASIBLE','UNKNOWN')
          PY
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add -f data/depth5_k13_s5_lex_feasibility.json analysis/DEPTH5_K13_S5_LEX_FEASIBILITY.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze depth5 K13 S5 lex-leader attack'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

name: depth5 induced subgroup cuts
on:
  push:
    branches: [master]
    paths:
      - 'analysis/depth5_induced_subgroup_cuts.py'
      - '.github/workflows/depth5_induced_subgroup_cuts.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: depth5-induced-cuts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install exact-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Execute subgroup cuts and full LP
        shell: bash
        run: |
          set -o pipefail
          python analysis/depth5_induced_subgroup_cuts.py --write 2>&1 | tee analysis/DEPTH5_INDUCED_SUBGROUP_CUTS.log
      - name: Commit evidence
        shell: bash
        run: |
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add data/depth5_induced_subgroup_cuts.json
          git add -f analysis/DEPTH5_INDUCED_SUBGROUP_CUTS.log
          if ! git diff --cached --quiet; then
            git commit -m 'Materialize induced depth-5 subgroup cuts and full LP test'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

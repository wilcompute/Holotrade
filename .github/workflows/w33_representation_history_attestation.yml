name: W33 representation history attestation

on:
  push:
    branches: [master]
    paths:
      - 'js/w33-representation-market-merkle-provenance.js'
      - 'js/w33-continuation-attestation.js'
      - 'scheduler/w33-continuation-scheduler.js'
      - 'scheduler/w33-continuation-transaction.js'
      - 'scheduler/w33-dynamic-resource-transaction.js'
      - 'tests/w33-representation-market-history-attestation-crossrepo.test.js'
      - 'analysis/w33_mmr_history_migration_certificate.js'
      - '.github/workflows/w33_representation_history_attestation.yml'
  workflow_dispatch:

jobs:
  history-bound-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Holotrade
        uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate current signed representation economics certificate
        run: PYTHONPATH=w33/analysis python w33/analysis/w33_signed_representation_economics.py
      - name: Verify history-root scheduling, attestation, replay, and delivery binding
        env:
          W33_SIGNED_RESOURCE_CERT: ${{ github.workspace }}/w33/analysis/w33_signed_representation_economics_certificate.json
        run: |
          node --test tests/w33-representation-market-merkle-provenance-crossrepo.test.js
          node --test tests/w33-representation-market-history-attestation-crossrepo.test.js
          node --test tests/w33-representation-market-identity-crossrepo.test.js
          node --test tests/w33-continuation-attestation.test.js
          node --test tests/w33-continuation-transaction.test.js
      - name: Materialize one concrete append-only migration certificate
        env:
          W33_SIGNED_RESOURCE_CERT: ${{ github.workspace }}/w33/analysis/w33_signed_representation_economics_certificate.json
        run: node analysis/w33_mmr_history_migration_certificate.js
      - uses: actions/upload-artifact@v4
        with:
          name: w33-mmr-history-migration-certificate
          path: analysis/w33_mmr_history_migration_certificate.json

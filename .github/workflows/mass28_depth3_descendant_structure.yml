name: Mass28 depth3 descendant structure

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass28_depth3_descendant_structure.py'
      - 'analysis/mass28_depth4_birth_frontier.py'
      - 'analysis/mass24_1080_gset_character_fingerprint.py'
      - '.github/workflows/mass28_depth3_descendant_structure.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Holotrade
        uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: python -m pip install --upgrade pip && pip install numpy scipy sympy networkx ortools
      - name: Classify parent-stabilizer point types and optimal negativity support
        env:
          W33_ANALYSIS: ${{ github.workspace }}/w33/analysis
        run: PYTHONPATH=analysis:${{ github.workspace }}/w33/analysis python analysis/mass28_depth3_descendant_structure.py
      - uses: actions/upload-artifact@v4
        with:
          name: mass28-depth3-descendant-structure
          path: analysis/mass28_depth3_descendant_structure_certificate.json

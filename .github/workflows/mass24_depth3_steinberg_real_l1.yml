name: Mass24 depth3 Steinberg + real-l1

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass24_depth3_steinberg_real_l1.py'
      - 'analysis/mass24_no_pencil_depth3_birth_certificate.json'
      - '.github/workflows/mass24_depth3_steinberg_real_l1.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Holotrade
        uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact algebra dependencies
        run: python -m pip install --upgrade pip && pip install numpy scipy sympy networkx ortools
      - name: Test equivariant identification and exact real-l1
        env:
          W33_ANALYSIS: ${{ github.workspace }}/w33/analysis
        run: PYTHONPATH=analysis:${{ github.workspace }}/w33/analysis python analysis/mass24_depth3_steinberg_real_l1.py
      - uses: actions/upload-artifact@v4
        with:
          name: mass24-depth3-steinberg-real-l1
          path: analysis/mass24_depth3_steinberg_real_l1_certificate.json

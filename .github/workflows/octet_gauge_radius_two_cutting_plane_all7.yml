name: Octet gauge radius-two cutting-plane all seven

on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_gauge_radius_two_cutting_plane.py'
      - '.github/workflows/octet_gauge_radius_two_cutting_plane_all7.yml'
  workflow_dispatch:

jobs:
  cutting-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install numpy scipy sympy ortools
      - name: Exact separation-oracle attack on exceptional coset ${{ matrix.index }}
        run: python analysis/octet_gauge_radius_two_cutting_plane.py --index ${{ matrix.index }} --bound 10 --budget 480 --batch 64 --write
      - uses: actions/upload-artifact@v4
        with:
          name: octet-radius-two-cutting-plane-${{ matrix.index }}
          path: analysis/octet_gauge_radius_two_cutting_plane_${{ matrix.index }}.json

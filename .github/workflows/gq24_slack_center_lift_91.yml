name: GQ24 slack-center lift at 91
on:
  push:
    branches: [master]
    paths:
      - 'analysis/gq24_slack_center_lift_91.py'
      - '.github/workflows/gq24_slack_center_lift_91.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gq24-slack-center-91-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install solver
        run: python -m pip install --disable-pip-version-check ortools
      - name: Prove local stability and attack 91
        shell: bash
        run: |
          set -o pipefail
          python analysis/gq24_slack_center_lift_91.py --write 2>&1 | tee analysis/GQ24_SLACK_CENTER_LIFT_91.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/gq24_slack_center_lift_91.json').read_text())
          assert d.get('valid') is True
          PY
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add analysis/GQ24_SLACK_CENTER_LIFT_91.log data/gq24_slack_center_lift_91.json
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze GQ24 slack-center target-91 evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

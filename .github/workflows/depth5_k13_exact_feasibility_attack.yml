name: depth5 K13 exact feasibility
on:
  push:
    branches: [master]
    paths:
      - 'analysis/depth5_k13_exact_feasibility_attack.py'
      - '.github/workflows/depth5_k13_exact_feasibility_attack.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holotrade-depth5-k13-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy ortools pyscipopt
      - name: Execute K13 feasibility attack
        shell: bash
        run: |
          set -o pipefail
          python analysis/depth5_k13_exact_feasibility_attack.py 2>&1 | tee analysis/DEPTH5_K13_EXACT_FEASIBILITY.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/depth5_k13_exact_feasibility_attack.json').read_text())
          assert d.get('valid') is True
          assert d['result'] in ('K13_INFEASIBLE','K13_FEASIBLE','UNKNOWN')
          PY
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add -f data/depth5_k13_exact_feasibility_attack.json analysis/DEPTH5_K13_EXACT_FEASIBILITY.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze exact depth5 K13 feasibility attack'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

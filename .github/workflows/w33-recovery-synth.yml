name: W33 Recovery RTL

on:
  push:
    branches: [master]
    paths:
      - 'rtl/w33_recovery_two_stage_core.v'
      - 'rtl/w33_recovery_two_stage_core_compact.v'
      - 'rtl/verify_w33_recovery_two_stage_core.ys'
      - 'rtl/synth_w33_recovery_two_stage_core.ys'
      - 'rtl/synth_w33_recovery_compare.ys'
      - 'tests/w33-recovery-two-stage-rtl.test.js'
      - 'package.json'
      - '.github/workflows/w33-recovery-synth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install portable Yosys
        run: python -m pip install yowasp-yosys==0.67.0.0.post1190
      - name: Verify software and RTL source
        run: npm run verify:w33-recovery-two-stage
      - name: Synthesize two-stage recovery core
        run: npm run synth:w33-recovery-two-stage

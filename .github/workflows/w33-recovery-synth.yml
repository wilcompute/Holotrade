name: W33 Recovery RTL

on:
  push:
    branches: [master]
    paths:
      - 'rtl/w33_recovery_two_stage_core.v'
      - 'rtl/verify_w33_recovery_two_stage_core.ys'
      - 'rtl/verify_w33_recovery_compact_equiv.ys'
      - 'rtl/synth_w33_recovery_two_stage_core.ys'
      - 'rtl/synth_w33_recovery_compare.ys'
      - 'scripts/gen-w33-recovery-compact.js'
      - 'analysis/w33_recovery_edge_gradient_carrier.js'
      - 'analysis/w33_pg34_secant_microstate_product.js'
      - 'data/w33_recovery_edge_gradient_carrier.json'
      - 'data/w33_pg34_secant_microstate_product.json'
      - 'tests/w33-recovery-two-stage-rtl.test.js'
      - 'package.json'
      - '.github/workflows/w33-recovery-synth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify recovery policy regression
        run: node --test tests/w33-recovery-two-stage-rtl.test.js

  geometry-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Certify W33 directed-edge gradient carrier
        run: node analysis/w33_recovery_edge_gradient_carrier.js
      - name: Test PG34 secant labels against six-state recovery fibres
        run: node analysis/w33_pg34_secant_microstate_product.js

  compact-equivalence-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install portable Yosys
        run: python -m pip install yowasp-yosys==0.67.0.0.post1190
      - name: Verify baseline RTL source
        run: node scripts/run-yosys.js rtl/verify_w33_recovery_two_stage_core.ys
      - name: Generate compact adjacency-indexed RTL
        run: node scripts/gen-w33-recovery-compact.js
      - name: Prove compact RTL equivalent to baseline
        run: node scripts/run-yosys.js rtl/verify_w33_recovery_compact_equiv.ys
      - name: Synthesize baseline and compact cores to LUT4
        run: node scripts/run-yosys.js rtl/synth_w33_recovery_compare.ys
      - name: Show measured comparison
        run: |
          echo '--- baseline ---'
          cat rtl/build/w33_recovery_baseline_lut4.txt
          echo '--- compact ---'
          cat rtl/build/w33_recovery_compact_lut4.txt

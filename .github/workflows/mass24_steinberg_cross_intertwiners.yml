name: Mass24 Steinberg cross intertwiners

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass24_steinberg_cross_intertwiners.py'
      - '.github/workflows/mass24_steinberg_cross_intertwiners.yml'
  workflow_dispatch:

jobs:
  intertwiners:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Holotrade
        uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install numpy sympy
      - name: Materialize exact 15-dimensional Steinberg cross Hom basis
        env:
          W33_ANALYSIS: ${{ github.workspace }}/w33/analysis
        run: PYTHONPATH=analysis python analysis/mass24_steinberg_cross_intertwiners.py
      - uses: actions/upload-artifact@v4
        with:
          name: mass24-steinberg-cross-intertwiners
          path: analysis/mass24_steinberg_cross_intertwiners_certificate.json

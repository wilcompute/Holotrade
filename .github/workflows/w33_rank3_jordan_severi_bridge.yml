name: W33 rank-three Jordan Severi bridge

on:
  push:
    branches: [master]
    paths:
      - 'analysis/the_rank_three_jordan_bridge_closes_at_q3.py'
      - 'data/rank_three_jordan_severi_bridge.json'
      - '.github/workflows/w33_rank3_jordan_severi_bridge.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove integral double-adjoint identity and q=3 bridge
        run: python analysis/the_rank_three_jordan_bridge_closes_at_q3.py --write
      - name: Recheck materialized certificate
        run: python -c "import json; d=json.load(open('data/rank_three_jordan_severi_bridge.json')); assert d['status']=='PASS' and all(d['checks'].values()) and d['exactPolynomialCertificate']['zeroDifferenceCoordinates']==15"
      - uses: actions/upload-artifact@v4
        with:
          name: rank-three-jordan-severi-bridge
          path: data/rank_three_jordan_severi_bridge.json
          if-no-files-found: error

name: Holotrade heterotic model-source provenance replay
on:
  push:
    branches: [master]
    paths:
      - 'analysis/heterotic_model_source_provenance_audit.py'
      - 'tests/test_heterotic_model_source_provenance_audit.py'
      - '.github/workflows/heterotic_model_source_provenance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. python analysis/heterotic_model_source_provenance_audit.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_heterotic_model_source_provenance_audit.py
      - name: Freeze certificate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/heterotic_model_source_provenance_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze heterotic model-source provenance certificate [skip ci]'
          git pull --rebase origin master
          git push origin HEAD:master

name: GQ24 target 91 two-exception center model
on:
  push:
    branches: [master]
    paths:
      - 'analysis/gq24_91_two_exception_center_model.py'
      - '.github/workflows/gq24_91_two_exception_center_model.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gq24-91-two-exception-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install solver
        run: python -m pip install --disable-pip-version-check ortools
      - name: Execute exact two-exception model
        shell: bash
        run: |
          set -o pipefail
          python analysis/gq24_91_two_exception_center_model.py --write 2>&1 | tee analysis/GQ24_91_TWO_EXCEPTION_CENTER_MODEL.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/gq24_91_two_exception_center_model.json').read_text())
          assert d.get('valid') is True
          assert d['localTheorem']['size11CenterlessBlockerStatus']=='INFEASIBLE'
          PY
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add data/gq24_91_two_exception_center_model.json
          git add -f analysis/GQ24_91_TWO_EXCEPTION_CENTER_MODEL.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze GQ24 target-91 two-exception evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

name: depth5 coordinate S5 automorphism
on:
  push:
    branches: [master]
    paths:
      - 'analysis/depth5_coordinate_s5_automorphism.py'
      - '.github/workflows/depth5_coordinate_s5_automorphism.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holotrade-depth5-coordinate-s5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Execute S5 automorphism audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/depth5_coordinate_s5_automorphism.py 2>&1 | tee analysis/DEPTH5_COORDINATE_S5_AUTOMORPHISM.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/depth5_coordinate_s5_automorphism.json').read_text())
          assert d.get('valid') is True
          assert d.get('groupOrder')==120
          assert d.get('exactMatrixAutomorphismVerified') is True
          PY
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add -f data/depth5_coordinate_s5_automorphism.json analysis/DEPTH5_COORDINATE_S5_AUTOMORPHISM.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze exact depth5 coordinate S5 automorphism'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

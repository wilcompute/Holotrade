name: Mass24 birth + mass20 real-l1 frontier

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass24_birth_mass20_census_real_l1.py'
      - '.github/workflows/mass24_mass20_real_l1_frontier.yml'
  workflow_dispatch:

jobs:
  complete-mass20-census-real-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact finite-geometry dependencies
        run: python -m pip install --upgrade pip && pip install numpy scipy sympy ortools
      - name: Complete mass20 census and exact real-l1 filtration
        run: python analysis/mass24_birth_mass20_census_real_l1.py --skip-mass24 --write
      - uses: actions/upload-artifact@v4
        with:
          name: complete-mass20-census-real-l1
          path: analysis/complete_mass20_census_real_l1_certificate.json

  mass24-no-pencil-birth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact finite-geometry dependencies
        run: python -m pip install --upgrade pip && pip install numpy scipy sympy ortools
      - name: Exhaust no-pencil mass24 sector or report scoped boundary
        run: python analysis/mass24_birth_mass20_census_real_l1.py --mass24-only --budget 720 --cap 500000 --depth-budget 60 --write
      - uses: actions/upload-artifact@v4
        with:
          name: mass24-no-pencil-depth3-birth
          path: analysis/mass24_no_pencil_depth3_birth_certificate.json

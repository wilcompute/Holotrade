name: W33 quantum routing benchmark

on:
  push:
    branches: [master]
    paths:
      - 'experiments/w33_quantum_routing_benchmark.js'
      - 'tests/w33-quantum-routing-benchmark.test.js'
      - 'data/w33_quantum_routing_benchmark.json'
      - '.github/workflows/w33-quantum-routing-benchmark.yml'
  pull_request:
    paths:
      - 'experiments/w33_quantum_routing_benchmark.js'
      - 'tests/w33-quantum-routing-benchmark.test.js'
      - 'data/w33_quantum_routing_benchmark.json'
      - '.github/workflows/w33-quantum-routing-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run semantic benchmark tests
        run: node --test tests/w33-quantum-routing-benchmark.test.js
      - name: Regenerate benchmark certificate independently
        run: node experiments/w33_quantum_routing_benchmark.js --write=/tmp/w33_quantum_routing_benchmark.json > /tmp/w33-qroute.stdout.json
      - name: Require semantic frozen-certificate equality
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const frozen = JSON.parse(fs.readFileSync('data/w33_quantum_routing_benchmark.json', 'utf8'));
          const fresh = JSON.parse(fs.readFileSync('/tmp/w33_quantum_routing_benchmark.json', 'utf8'));
          assert.deepEqual(frozen, fresh);
          console.log('Frozen W33 quantum-routing certificate matches fresh deterministic output.');
          NODE

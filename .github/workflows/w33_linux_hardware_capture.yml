name: W33 Linux hardware audit capture

on:
  workflow_dispatch:
    inputs:
      enrollment_config:
        description: Absolute path on the self-hosted runner to TPM enrollment config JSON
        required: true
        default: /etc/holotrade/w33-tpm-enrollment.json
      capture_config:
        description: Absolute path on the self-hosted runner to host bundle capture config JSON
        required: true
        default: /etc/holotrade/w33-host-capture.json
  push:
    branches: [master]
    paths:
      - 'hardware/w33-tpm-capture-request-*.json'

jobs:
  hardware-capture:
    runs-on: [self-hosted, linux, w33-tpm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve manual or push-triggered host config paths
        id: config
        shell: bash
        run: |
          set -euo pipefail
          enrollment='${{ github.event.inputs.enrollment_config }}'
          capture='${{ github.event.inputs.capture_config }}'
          if [ -z "$enrollment" ]; then enrollment=/etc/holotrade/w33-tpm-enrollment.json; fi
          if [ -z "$capture" ]; then capture=/etc/holotrade/w33-host-capture.json; fi
          printf 'enrollment=%s\n' "$enrollment" >> "$GITHUB_OUTPUT"
          printf 'capture=%s\n' "$capture" >> "$GITHUB_OUTPUT"
      - name: Run non-secret TPM runner preflight
        shell: bash
        run: |
          set -euo pipefail
          node bin/w33-tpm-runner-preflight.js '${{ steps.config.outputs.enrollment }}' '${{ steps.config.outputs.capture }}' | tee w33-tpm-runner-preflight.json
      - name: Execute real TPM MakeCredential ActivateCredential enrollment
        shell: bash
        run: |
          set -euo pipefail
          node bin/w33-tpm-enroll.js '${{ steps.config.outputs.enrollment }}' | tee w33-real-tpm-enrollment-result.json
          node -e 'const x=require("./w33-real-tpm-enrollment-result.json"); if(!x.ok||!x.body||x.body.hardwareBacked!==true) process.exit(1)'
      - name: Capture host bundle and require portable verifier PASS
        shell: bash
        run: |
          set -euo pipefail
          node bin/w33-capture-host-bundle.js '${{ steps.config.outputs.capture }}' | tee w33-real-host-capture-verifier-output.json
          node - '${{ steps.config.outputs.capture }}' <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const cfg=JSON.parse(fs.readFileSync(path.resolve(process.argv[2]),'utf8'));
          const source=path.resolve(cfg.outputPath||'w33-host-bundle.json');
          if(!fs.existsSync(source)) throw new Error(`capture did not create ${source}`);
          fs.copyFileSync(source,path.resolve('w33-real-host-bundle.json'));
          fs.copyFileSync(path.resolve(cfg.trustedReceiptPublicKeyPath),path.resolve('w33-real-trusted-receipt-public-key.pem'));
          NODE
          node bin/w33-verify-receipt.js w33-real-host-bundle.json w33-real-trusted-receipt-public-key.pem | tee w33-real-portable-verifier-result.json
      - name: Upload real hardware evidence
        uses: actions/upload-artifact@v4
        with:
          name: w33-real-linux-tpm-audit-bundle
          path: |
            w33-tpm-runner-preflight.json
            w33-real-tpm-enrollment-result.json
            w33-real-host-bundle.json
            w33-real-portable-verifier-result.json
            w33-real-host-capture-verifier-output.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload preflight even when capture fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w33-tpm-runner-preflight
          path: w33-tpm-runner-preflight.json
          if-no-files-found: ignore
          retention-days: 30

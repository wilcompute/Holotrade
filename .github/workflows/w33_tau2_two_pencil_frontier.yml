name: W33 tau2 two-pencil frontier

on:
  push:
    branches: [master]
    paths:
      - 'analysis/the_mass_eight_excess_is_two_pencils.py'
      - 'analysis/the_111_two_pencil_factorization.py'
      - 'analysis/the_10480_twelve_point_blockers.py'
      - 'analysis/the_111_aggregate_parity_is_octet_boundary.py'
      - 'analysis/the_111_double_six_section_invariant.py'
      - 'analysis/the_minimum_blocker_labels_are_octets.py'
      - '.github/workflows/w33_tau2_two_pencil_frontier.yml'
  workflow_dispatch:

jobs:
  exact-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy ortools
      - name: Recompute mass-eight two-pencil theorem
        run: python analysis/the_mass_eight_excess_is_two_pencils.py --write
      - name: Recompute all 12-point blockers
        run: python analysis/the_10480_twelve_point_blockers.py --write
      - name: Recompute aggregate parity and H10 boundary result
        run: python analysis/the_111_aggregate_parity_is_octet_boundary.py --write
      - name: Recompute all 36 spread/double-six section invariants
        run: python analysis/the_111_double_six_section_invariant.py --write
      - name: Run exact 88-token factorization in all three centre cases
        run: python analysis/the_111_two_pencil_factorization.py --budget 180 --workers 8 --write
      - name: Validate frontier certificates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data')
          mass=json.load(open(root/'mass_eight_excess_two_pencils.json'))
          b12=json.load(open(root/'the_10480_twelve_point_blockers.json'))
          par=json.load(open(root/'the_111_aggregate_parity_is_octet_boundary.json'))
          sec=json.load(open(root/'the_111_double_six_section_invariant.json'))
          fac=json.load(open(root/'the_111_two_pencil_factorization.json'))
          assert mass['status']=='PASS'
          assert b12['status']=='PASS' and b12['total']==10480
          assert par['status']=='PASS' and par['dimensions']['H10']==10
          assert sec['status']=='PASS' and all(v['orderedTypeAssignmentsSurviving']==95 for v in sec['cases'].values())
          assert fac['status']=='PASS'
          assert set(fac['cases'])=={'equal','collinear','noncollinear'}
          assert all(v['status'] in {'SAT','UNSAT','UNKNOWN'} for v in fac['cases'].values())
          print('factorization statuses:', {k:v['status'] for k,v in fac['cases'].items()})
          print('certified interval:', fac['certifiedTau2IntervalAfterThisPass'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w33-tau2-two-pencil-frontier
          path: |
            data/mass_eight_excess_two_pencils.json
            data/the_10480_twelve_point_blockers.json
            data/the_111_aggregate_parity_is_octet_boundary.json
            data/the_111_double_six_section_invariant.json
            data/the_111_two_pencil_factorization.json
          if-no-files-found: error

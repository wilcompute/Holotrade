name: Octet circuit library minimization

on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_circuit_library_minimization.py'
      - 'analysis/octet_single_circuit_obstruction_certificate.json'
      - 'analysis/octet_circuit_decoder_trap_certificate.json'
      - '.github/workflows/octet_circuit_library_minimization.yml'
  workflow_dispatch:

jobs:
  minimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install ortools scipy sympy
      - name: Minimize PSp-invariant certified circuit fallback
        run: PYTHONPATH=analysis python analysis/octet_circuit_library_minimization.py
      - uses: actions/upload-artifact@v4
        with:
          name: octet-circuit-library-minimization
          path: analysis/octet_circuit_library_minimization_certificate.json

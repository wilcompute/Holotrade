name: W33 representation market provenance

on:
  push:
    branches: [master]
    paths:
      - 'js/w33-representation-market-identity.js'
      - 'js/w33-representation-market-provenance.js'
      - 'tests/w33-representation-market-provenance-crossrepo.test.js'
      - '.github/workflows/w33_representation_market_provenance.yml'
  workflow_dispatch:

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate signed-resource certificate
        run: PYTHONPATH=w33/analysis python w33/analysis/w33_signed_representation_economics.py
      - name: Verify append-only representation history
        env:
          W33_SIGNED_RESOURCE_CERT: ${{ github.workspace }}/w33/analysis/w33_signed_representation_economics_certificate.json
        run: node --test tests/w33-representation-market-provenance-crossrepo.test.js

name: Node Test Diagnostic

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/node-test-diagnostic.yml'
      - 'tools/run-node-tests-diagnostic.js'
      - 'tests/**'
      - 'telemetry/**'
      - 'analysis/e8_*.js'
      - 'analysis/e8_*.g'
      - 'data/w35_ovoid_deficiency_state.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install GAP/GRAPE and portable Yosys for exact witnesses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gap gap-grape
          python -m pip install yowasp-yosys==0.67.0.0.post1190
      - name: Build W33 near-ovoid corpus
        run: node analysis/w33_near_ovoid_corpus.js --write
      - name: Run every Node test file independently
        run: node tools/run-node-tests-diagnostic.js
      - name: Upload diagnostic ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-diagnostics-${{ github.run_id }}
          path: node-test-diagnostics.json
          if-no-files-found: error

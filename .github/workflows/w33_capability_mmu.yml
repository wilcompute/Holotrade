name: W33 capability MMU

on:
  push:
    branches: [master]
    paths:
      - 'rtl/w33_capability_mmu.v'
      - 'rtl/w33_capability_machine.v'
      - 'rtl/verify_w33_capability_mmu.ys'
      - 'rtl/synth_w33_capability_mmu.ys'
      - 'rtl/synth_w33_capability_machine.ys'
      - '.github/workflows/w33_capability_mmu.yml'
  workflow_dispatch:

jobs:
  formal-and-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install portable Yosys
        run: python -m pip install yowasp-yosys==0.67.0.0.post1190
      - name: Prove non-escalation and dereference gate
        run: node scripts/run-yosys.js rtl/verify_w33_capability_mmu.ys
      - name: Synthesize MMU gate
        run: node scripts/run-yosys.js rtl/synth_w33_capability_mmu.ys
      - name: Synthesize four-register capability machine
        run: node scripts/run-yosys.js rtl/synth_w33_capability_machine.ys

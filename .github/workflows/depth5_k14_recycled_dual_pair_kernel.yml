name: depth5 K14 recycled dual pair kernel
on:
  push:
    branches: [master]
    paths:
      - 'analysis/depth5_k14_recycled_dual_pair_kernel.py'
      - '.github/workflows/depth5_k14_recycled_dual_pair_kernel.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy ortools
      - name: Execute recycled-dual K14 attack
        run: |
          set -o pipefail
          python analysis/depth5_k14_recycled_dual_pair_kernel.py 2>&1 | tee analysis/DEPTH5_K14_RECYCLED_DUAL_PAIR_KERNEL.log
      - name: Freeze evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/depth5_k14_recycled_dual_pair_kernel.json').read_text())
          assert d['valid'] is True
          assert d['basisCertificate']['k13Result']=='K13_INFEASIBLE'
          assert d['symmetry']['group']=='S5' and d['symmetry']['order']==120
          assert d['fixedOrbitBranchCount']==88
          PY
          git config user.name holotrade-evidence-bot
          git config user.email holotrade-evidence-bot@users.noreply.github.com
          git add -f data/depth5_k14_recycled_dual_pair_kernel.json analysis/DEPTH5_K14_RECYCLED_DUAL_PAIR_KERNEL.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze exact depth5 K14 recycled-dual pair evidence'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

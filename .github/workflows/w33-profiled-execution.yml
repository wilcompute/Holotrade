name: W33 profiled execution
on:
  push:
    paths:
      - 'js/w33-execution-profile.js'
      - 'js/w33-profiled-execution.js'
      - 'tests/w33-profiled-execution.test.js'
      - 'rtl/w33_profile_admission.v'
      - 'rtl/verify_w33_profile_admission.ys'
      - '.github/workflows/w33-profiled-execution.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install yowasp-yosys
      - name: Profile scheduler and GoMicroVM tests
        run: node --test tests/w33-profiled-execution.test.js
      - name: Formal admission proof
        run: node scripts/run-yosys.js rtl/verify_w33_profile_admission.ys

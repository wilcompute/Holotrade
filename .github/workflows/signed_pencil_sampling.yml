name: Exact signed pencil sampling certificates
on:
  push:
    branches: [master]
    paths:
      - 'analysis/signed_pencil_sampling_witness.py'
      - 'analysis/signed_pencil_dual_geometry*'
      - 'analysis/signed_pencil_sampling_certificate.json'
      - 'analysis/the_mass12_census_is_complete_and_has_one_exception.py'
      - '.github/workflows/signed_pencil_sampling.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Solver-free rational certificate and corruption checks
        run: python -S analysis/signed_pencil_sampling_witness.py --check
      - name: Discovery dependencies
        run: python -m pip install numpy scipy sympy
      - name: Reconstruct witnesses and audit exact samplers
        run: python analysis/signed_pencil_sampling_witness.py
      - name: Exact dual point potentials and optimal support constraints
        run: python analysis/signed_pencil_dual_geometry.py

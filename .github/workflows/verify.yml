name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install GAP for exact group witnesses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gap
      - name: Build W33 near-ovoid corpus
        run: node analysis/w33_near_ovoid_corpus.js --write
      - name: Run Node tests with per-file diagnostics
        if: always()
        run: node tools/run-node-tests-diagnostic.js
      - name: Upload Node test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-diagnostics-${{ github.run_id }}
          path: node-test-diagnostics.json
          if-no-files-found: error

  rtl:
    name: RTL formal and synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install portable Yosys
        run: python -m pip install yowasp-yosys==0.67.0.0.post1190
      - name: Prove RTL equivalence
        run: npm run verify:rtl
      - name: Synthesize RTL targets
        run: npm run synth:rtl
      - name: Check synthesis artifacts
        run: |
          test -s rtl/build/synth_generic.txt
          test -s rtl/build/synth_ice40.txt
          test -s rtl/build/holotrade_admit.json

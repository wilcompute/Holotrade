name: W33 Ledger stress crossrepo
on:
  push:
    paths:
      - 'js/w33-ledger-stress-policy.js'
      - 'tests/w33-ledger-stress-policy.test.js'
      - 'data/w33_ledger_stress_crossrepo.json'
      - 'research/w33_ledger_stress_test.md'
      - '.github/workflows/w33_ledger_stress.yml'
  pull_request:
    paths:
      - 'js/w33-ledger-stress-policy.js'
      - 'tests/w33-ledger-stress-policy.test.js'
      - 'data/w33_ledger_stress_crossrepo.json'
      - 'research/w33_ledger_stress_test.md'
      - '.github/workflows/w33_ledger_stress.yml'
  workflow_dispatch:

jobs:
  ledger-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact finite-math dependencies
        run: python -m pip install numpy sympy
      - name: Recompute all five W33 Ledger stress certificates
        working-directory: w33
        run: python analysis/run_w33_ledger_stress_suite.py
      - name: Enforce Holotrade cross-repo claim firewall
        run: W33_LEDGER_ROOT="$GITHUB_WORKSPACE/w33" node --test tests/w33-ledger-stress-policy.test.js

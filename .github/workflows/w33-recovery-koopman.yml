name: W33 Recovery Koopman

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_recovery_koopman_full.js'
      - '.github/workflows/w33-recovery-koopman.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  koopman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Full finite Koopman/Jordan census
        run: node analysis/w33_recovery_koopman_full.js

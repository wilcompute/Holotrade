name: Octet gauge radius-two global attack

on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_gauge_radius_two_global_attack.py'
      - '.github/workflows/octet_gauge_radius_two_global_attack.yml'
  workflow_dispatch:

jobs:
  radius-two-all-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact SAT dependencies
        run: python -m pip install --upgrade pip && pip install numpy scipy sympy ortools
      - name: Search all seven exceptional cosets for radius-two traps
        run: python analysis/octet_gauge_radius_two_global_attack.py --bound 8 --budget 70 --write
      - uses: actions/upload-artifact@v4
        with:
          name: octet-gauge-radius-two-global-attack
          path: analysis/octet_gauge_radius_two_global_attack_certificate.json

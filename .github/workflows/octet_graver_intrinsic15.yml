name: Octet Graver intrinsic 15D decoder

on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_graver_intrinsic15.py'
      - 'analysis/octet_gauge_local_minimum_counterexample.py'
      - 'analysis/signed_pencil_sampling_witness.py'
      - '.github/workflows/octet_graver_intrinsic15.yml'
  workflow_dispatch:

jobs:
  intrinsic-graver:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install ortools sympy
          while IFS= read -r f; do sudo rm -f "$f"; done < <(sudo grep -RIl 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y 4ti2
      - name: Build reduced exact 25x40 presentation and intrinsic 15D basis
        run: PYTHONPATH=analysis python analysis/octet_graver_intrinsic15.py --write-matrix
      - name: Compute exact Graver basis on reduced presentation
        id: graver
        run: |
          set -euo pipefail
          BIN="$(command -v 4ti2-graver || command -v graver || true)"
          if [ -z "$BIN" ]; then echo '4ti2 graver executable not found'; dpkg -L 4ti2; exit 1; fi
          VERSION="$($BIN --version 2>&1 | head -n 1 || true)"
          if [ -z "$VERSION" ]; then VERSION="$(dpkg-query -W -f='${Version}' 4ti2)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cd analysis
          "$BIN" octet_graver_intrinsic15
          test -s octet_graver_intrinsic15.gra
      - name: Verify universal decoder radius and intrinsic coordinates
        env:
          FOURTI2_VERSION: ${{ steps.graver.outputs.version }}
        run: PYTHONPATH=analysis python analysis/octet_graver_intrinsic15.py --gra analysis/octet_graver_intrinsic15.gra --version "$FOURTI2_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: octet-graver-intrinsic15
          path: |
            analysis/octet_graver_intrinsic15.mat
            analysis/octet_graver_intrinsic15.gra
            analysis/octet_graver_intrinsic15_presentation.json
            analysis/octet_graver_intrinsic15_certificate.json

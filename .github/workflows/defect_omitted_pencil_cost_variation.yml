name: omitted pencil defect pricing variation
on:
  push:
    branches: [master]
    paths:
      - 'analysis/defect_omitted_pencil_cost_variation.py'
      - '.github/workflows/defect_omitted_pencil_cost_variation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: holotrade-omitted-pencil-cost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check ortools
      - name: Execute variation audit
        shell: bash
        run: |
          set -o pipefail
          python analysis/defect_omitted_pencil_cost_variation.py 2>&1 | tee analysis/DEFECT_OMITTED_PENCIL_COST_VARIATION.log
      - name: Freeze evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/defect_omitted_pencil_cost_variation.json').read_text())
          assert d.get('valid') is True
          PY
          git config user.name 'holotrade-evidence-bot'
          git config user.email 'holotrade-evidence-bot@users.noreply.github.com'
          git add -f data/defect_omitted_pencil_cost_variation.json analysis/DEFECT_OMITTED_PENCIL_COST_VARIATION.log
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze omitted-pencil defect pricing variation'
            git pull --rebase origin master
            git push origin HEAD:master
          fi

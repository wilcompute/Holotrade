name: Octet hybrid certified decoder

on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_hybrid_certified_decoder.py'
      - 'analysis/octet_single_circuit_obstruction_certificate.json'
      - 'analysis/octet_gauge_radius_two_cutting_plane.py'
      - '.github/workflows/octet_hybrid_certified_decoder.yml'
  workflow_dispatch:

jobs:
  hybrid-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install ortools scipy sympy
      - name: Build and audit finite content-addressed decoder
        run: PYTHONPATH=analysis python analysis/octet_hybrid_certified_decoder.py
      - uses: actions/upload-artifact@v4
        with:
          name: octet-hybrid-certified-decoder
          path: analysis/octet_hybrid_certified_decoder_certificate.json

name: Portable dual gap escape receipts
on:
  push:
    branches: [master]
    paths:
      - 'analysis/octet_dual_gap_receipts*'
      - 'analysis/octet_circuit_decoder_trap_certificate.json'
      - 'analysis/octet_single_circuit_obstruction_certificate.json'
      - 'analysis/signed_pencil_sampling_witness.py'
      - '.github/workflows/octet_dual_gap_receipts.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify without solvers or site packages
        run: python -S analysis/octet_dual_gap_receipts.py --check
      - run: python -m pip install numpy scipy
      - name: Reconstruct duals and check every radius-two endpoint
        run: python analysis/octet_dual_gap_receipts.py

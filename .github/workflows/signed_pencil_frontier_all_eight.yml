name: Signed pencil eight-frontier certificate
on:
  push:
    branches: [master]
    paths:
      - 'analysis/signed_pencil_frontier_all_eight.py'
      - 'analysis/signed_pencil_sampling_witness.py'
      - 'analysis/the_mass12_census_is_complete_and_has_one_exception.py'
      - 'analysis/the_kernel_is_spanned_by_octet_differences.py'
      - '.github/workflows/signed_pencil_frontier_all_eight.yml'
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact frontier dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy sympy ortools
      - name: Execute all signed-pencil frontier attacks
        run: python analysis/signed_pencil_frontier_all_eight.py
      - name: Upload exact certificate
        uses: actions/upload-artifact@v4
        with:
          name: signed-pencil-frontier-all-eight
          path: analysis/signed_pencil_frontier_all_eight_certificate.json

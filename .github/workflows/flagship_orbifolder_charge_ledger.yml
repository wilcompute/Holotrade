name: Flagship orbifolder charge-ledger replay

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_flagship_orbifolder_model.py'
      - 'analysis/the_flagship_wilson_line_sits_in_the_third_pair.py'
      - '.github/workflows/flagship_orbifolder_charge_ledger.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install orbifolder build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl libgsl-dev libboost-all-dev libreadline-dev

      - name: Download and build orbifolder 1.2.1
        run: |
          curl -L --fail --retry 3 \
            https://orbifolder.hepforge.org/source/V1.2.1/orbifolder-1.2.1.tgz \
            -o /tmp/orbifolder-1.2.1.tgz
          tar xzf /tmp/orbifolder-1.2.1.tgz -C /tmp
          SRC="$(find /tmp -maxdepth 1 -type d -name 'orbifolder-1.2.1*' | head -1)"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          cd "$SRC"
          ./configure
          make -j2
          test -x ./src/orbifolder/orbifolder

      - name: Verify recorded flagship pair
        run: |
          python analysis/the_flagship_wilson_line_sits_in_the_third_pair.py

      - name: Enumerate the two shipped Z6-I geometries
        run: |
          cd "$SRC"
          find Geometry -maxdepth 1 -type f -name 'Geometry_Z6-I_*.txt' | sort | tee "$GITHUB_WORKSPACE/z6i_geometries.txt"
          test "$(wc -l < "$GITHUB_WORKSPACE/z6i_geometries.txt")" -eq 2
          echo "==== geometry headers ===="
          while IFS= read -r geometry; do
            echo "---- $geometry ----"
            sed -n '1,120p' "$geometry"
          done < "$GITHUB_WORKSPACE/z6i_geometries.txt"

      - name: Replay recorded pair45 on both Z6-I geometries
        run: |
          mkdir -p evidence/flagship_orbifolder
          cp z6i_geometries.txt evidence/flagship_orbifolder/
          while IFS= read -r geometry; do
            gid="$(basename "$geometry" .txt | tr -c 'A-Za-z0-9_' '_')"
            tag="${gid}_45"
            python analysis/w33_flagship_orbifolder_model.py \
              --output "$SRC/model_${tag}.txt" \
              --geometry "$geometry" \
              --pair 45
            cat > "$SRC/commands_${tag}.txt" <<EOF
          load orbifolds(model_${tag}.txt)
          cd SM_20260917_3
          cd gauge group
          print gauge group
          print U1 generators
          cd ..
          cd spectrum
          print summary with labels
          print(*) with internal information
          exit
          EOF
            (
              cd "$SRC"
              timeout 240s bash -c \
                "printf 'load program(commands_${tag}.txt)\\nyes\\n' | ./src/orbifolder/orbifolder" \
                > "$GITHUB_WORKSPACE/evidence/flagship_orbifolder/transcript_${tag}.txt" 2>&1 || true
            )
            cp "$SRC/model_${tag}.txt" "evidence/flagship_orbifolder/model_${tag}.txt"
            cp "$SRC/commands_${tag}.txt" "evidence/flagship_orbifolder/commands_${tag}.txt"
            echo "===== $tag ====="
            grep -E -i -A14 -B4 \
              'gauge group|spectrum|error|invalid|132|singlet|SU\(3\)|SU\(2\)' \
              "evidence/flagship_orbifolder/transcript_${tag}.txt" | tail -220 || true
          done < z6i_geometries.txt

      - name: Require both transcripts
        run: |
          count="$(find evidence/flagship_orbifolder -name 'transcript_*.txt' -size +0c | wc -l)"
          echo "nonempty transcripts: $count"
          test "$count" -eq 2
          wc -l evidence/flagship_orbifolder/transcript_*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: flagship-orbifolder-charge-ledger
          path: evidence/flagship_orbifolder/
          if-no-files-found: error

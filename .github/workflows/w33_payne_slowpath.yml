name: W33 Payne slow-path theorem

on:
  push:
    branches: [master]
    paths:
      - 'analysis/w33_payne_slowpath_core.py'
      - 'analysis/the_slow_path_is_the_payne_derivative.py'
      - 'analysis/payne_cover_spectral_intertwiner.py'
      - 'analysis/slow_targets_are_w33_minwords.py'
      - 'analysis/slow_target_eigenspaces_are_the_minword_support.py'
      - 'analysis/the_slow_orbit_has_a_closed_exterior_square_formula.py'
      - 'analysis/the_121_orbit_dictionary_is_formulaic.py'
      - 'analysis/the_payne_intertwiner_is_o5_polar_heavy_incidence.py'
      - 'analysis/o5_polar_incidence_splits_the_w33_24_15_modules.py'
      - 'data/the_45_slot_rom_bijection.json'
      - 'data/slow_path_is_payne_derivative.json'
      - 'data/payne_cover_spectral_intertwiner.json'
      - 'data/slow_targets_are_w33_minimum_words.json'
      - 'data/slow_o5_closed_form.json'
      - '.github/workflows/w33_payne_slowpath.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prove Payne-derived fast/slow correspondence
        run: python analysis/the_slow_path_is_the_payne_derivative.py --write
      - name: Recheck materialized Payne certificate
        run: test -s data/slow_path_is_payne_derivative.json && python -c "import json; d=json.load(open('data/slow_path_is_payne_derivative.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Prove 40x45 spectral intertwiner
        run: python analysis/payne_cover_spectral_intertwiner.py --write
      - name: Recheck spectral certificate
        run: test -s data/payne_cover_spectral_intertwiner.json && python -c "import json; d=json.load(open('data/payne_cover_spectral_intertwiner.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Identify 45 concrete slow targets with W33 minimum words
        run: python analysis/slow_targets_are_w33_minwords.py --write
      - name: Recheck minimum-word dictionary
        run: test -s data/slow_targets_are_w33_minimum_words.json && python -c "import json; d=json.load(open('data/slow_targets_are_w33_minimum_words.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Derive minimum-word support directly from target eigenspaces
        run: python analysis/slow_target_eigenspaces_are_the_minword_support.py --write
      - name: Recheck direct eigenspace decoder
        run: test -s data/slow_target_eigenspaces_are_the_minword_support.json && python -c "import json; d=json.load(open('data/slow_target_eigenspaces_are_the_minword_support.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Prove closed exterior-square formula for the 45 slow targets
        run: python analysis/the_slow_orbit_has_a_closed_exterior_square_formula.py --write
      - name: Recheck O5 closed-form certificate
        run: test -s data/slow_o5_closed_form.json && python -c "import json; d=json.load(open('data/slow_o5_closed_form.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Prove the full 121-point orthogonal dictionary formulaically
        run: python analysis/the_121_orbit_dictionary_is_formulaic.py --write
      - name: Recheck 121-point dictionary certificate
        run: test -s data/orthogonal_121_formulaic_dictionary.json && python -c "import json; d=json.load(open('data/orthogonal_121_formulaic_dictionary.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Derive Payne spectral transform from O5 polar heavy incidence
        run: python analysis/the_payne_intertwiner_is_o5_polar_heavy_incidence.py --write
      - name: Recheck polar heavy-incidence certificate
        run: test -s data/payne_o5_polar_heavy_incidence.json && python -c "import json; d=json.load(open('data/payne_o5_polar_heavy_incidence.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - name: Prove the O5 polar 24 plus 15 harmonic split
        run: python analysis/o5_polar_incidence_splits_the_w33_24_15_modules.py --write
      - name: Recheck 24 plus 15 split certificate
        run: test -s data/o5_polar_w33_24_15_split.json && python -c "import json; d=json.load(open('data/o5_polar_w33_24_15_split.json')); assert d['status']=='PASS' and all(d['checks'].values())"
      - uses: actions/upload-artifact@v4
        with:
          name: payne-fast-slow-certificates
          path: |
            data/slow_path_is_payne_derivative.json
            data/payne_cover_spectral_intertwiner.json
            data/slow_targets_are_w33_minimum_words.json
            data/slow_target_eigenspaces_are_the_minword_support.json
            data/slow_o5_closed_form.json
            data/orthogonal_121_formulaic_dictionary.json
            data/payne_o5_polar_heavy_incidence.json
            data/o5_polar_w33_24_15_split.json
          if-no-files-found: error

name: Mass40 depth5 structural types

on:
  push:
    branches: [master]
    paths:
      - 'analysis/mass40_depth5_structural_types.py'
      - 'analysis/mass40_no_pencil_exhaustive_summary.json'
      - 'analysis/exceptional_depth_derivative_automaton.py'
      - '.github/workflows/mass40_depth5_structural_types.yml'
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout W33-Theory master
        uses: actions/checkout@v4
        with:
          repository: wilcompute/W33-Theory
          ref: master
          path: w33
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip && pip install ortools scipy sympy numpy
      - name: Classify exact mass40 depth5 stabilizer/support/derivative signatures
        env:
          W33_ANALYSIS: ${{ github.workspace }}/w33/analysis
        run: PYTHONPATH=analysis python analysis/mass40_depth5_structural_types.py
      - uses: actions/upload-artifact@v4
        with:
          name: mass40-depth5-structural-types
          path: analysis/mass40_depth5_structural_types_certificate.json

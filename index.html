<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    The application lives in holotrade.html. This file exists only so the
    site keeps working at its root URL: GitHub Pages serves index.html for
    https://wilcompute.github.io/Holotrade/ and there is no server-side
    rewrite available to point that at a different filename.

    Redirect three ways so it holds regardless of how the page is reached:
    a meta refresh for plain navigation, a canonical link for crawlers, and
    a script replace() so the stub does not become a back-button trap.
  -->
  <title>HoloTrade</title>
  <link rel="canonical" href="holotrade.html">
  <meta http-equiv="refresh" content="0; url=holotrade.html">
  <script>location.replace("holotrade.html" + location.search + location.hash);</script>
  <style>
    body { background:#070b12; color:#93a3bd; font-family:system-ui,sans-serif;
           display:flex; align-items:center; justify-content:center;
           height:100vh; margin:0; }
    a { color:#38bdf8; }
  </style>
</head>
<body>
  <p>Loading <a href="holotrade.html">holotrade.html</a>&hellip;</p>
</body>
</html>
